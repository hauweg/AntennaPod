name: Fork Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: "Build installable debug APK"
    if: github.repository != 'AntennaPod/AntennaPod'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Provide fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            cp .github/fork-debug.keystore "$HOME/.android/debug.keystore"
          fi
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleFreeDebug
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/free/debug/*.apk | grep SHA-256
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AntennaPod-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/free/debug/*.apk
          retention-days: 30
